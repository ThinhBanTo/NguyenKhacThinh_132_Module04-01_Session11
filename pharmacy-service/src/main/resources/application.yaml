server:
  port: 8081

spring:
  application:
    name: pharmacy-service

  config:
    import: "optional:configserver:http://localhost:8888"

  datasource:
    url: jdbc:postgresql://localhost:5440/pharmacy_db
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379
      database: 0

  cache:
    type: redis
    redis:
      time-to-live: 60m

  session:
    timeout: 30m
    redis:
      namespace: rikkei:pharmacy:session
      save-mode: always

insurance:
  url: localhost:8083

warehouse:
  url: localhost:8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh